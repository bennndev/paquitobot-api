name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PaquitoBot.sln

      - name: Build application
        run: dotnet build PaquitoBot.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish PaquitoBot.Api/PaquitoBot.Api.csproj --configuration Release --output ./published --no-build
